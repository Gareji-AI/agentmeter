# One always-on process and one persistent SQLite disk. Review the Render price
# before creating paid resources. Supply secret values in Render, never in Git.
services:
  - type: web
    name: agentmeter-sandbox
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    branch: main
    autoDeployTrigger: 'off'
    buildCommand: node --version
    startCommand: node scripts/import-ledger.mjs && node src/server.mjs
    healthCheckPath: /health
    disk:
      name: agentmeter-ledger
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 26.10.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/agentmeter-sandbox.sqlite
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYOUT_MODE
        value: execute
      - key: DEMO_ACCESS_TOKEN
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SANDBOX_RECIPIENT
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: REQUIRE_EXISTING_LEDGER
        value: "1"
      - key: LEDGER_IMPORT_GZIP_BASE64
        sync: false
      - key: LEDGER_IMPORT_SHA256
        sync: false
